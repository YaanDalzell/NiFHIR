#version: '3'
services:
  nifi:
    image: apache/nifi:1.20.0
    container_name: nifi-container  # <--- Custom container name
    ports:
      - "8080:8080"
    environment:
      NIFI_WEB_HTTP_PORT: 8080
    volumes:
      - ./opt/nifi/drivers:/opt/nifi/nifi-current/drivers
      - ./opt/nifi/certs:/opt/certs
      - ./nifi-conf:/opt/nifi/nifi-current/conf


  nifi-registry:
    image: apache/nifi-registry:latest
    container_name: nifi-registry-container  # <--- Custom container name
    ports:
      - "18080:18080"
    volumes:
      - ./nifi-registry-data/flow_storage:/opt/nifi-registry/nifi-registry-current/flow_storage
      - ./nifi-registry-data/database:/opt/nifi-registry/nifi-registry-current/database
      - ./nifi-registry-data/logs:/opt/nifi-registry/logs
    environment:
      - NIFI_REGISTRY_WEB_HTTP_PORT=18080
      - NIFI_REGISTRY_SECURITY_REQUIRE_AUTHORIZATION=false

